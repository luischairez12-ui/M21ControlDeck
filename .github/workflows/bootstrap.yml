name: Bootstrap M21 Source and Build
on:
  push:
    branches: [main]
    paths:
      - "source.tar.xz.b64"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand Batch 1+2 Android project
        shell: bash
        run: |
          base64 -d source.tar.xz.b64 | tar -xJf -
          rm -f source.tar.xz.b64 .github/workflows/bootstrap.yml
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/build-apk.yml
      - name: Commit expanded source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand M21 Control Deck Batch 1+2 source" || true
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: M21ControlDeck-Batch1-2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
